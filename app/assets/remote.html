<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101114">
<title>Free My TV</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #101114; color: #f2f2f5; font: 16px -apple-system, Roboto, "Segoe UI", sans-serif;
         user-select: none; -webkit-user-select: none; }
  main { max-width: 420px; margin: 0 auto; padding: 18px 16px 32px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; opacity: .8; }
  button { border: 0; border-radius: 16px; background: #24262c; color: inherit; font: inherit; font-size: 18px;
           padding: 0; height: 58px; touch-action: manipulation; }
  button:active { background: #3a3d46; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .row > * { flex: 1; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
  .pad button { height: 78px; font-size: 26px; }
  .pad .ok { border-radius: 50%; background: #3b5bdb; font-size: 20px; font-weight: 600; }
  .pad .ok:active { background: #5c7cfa; }
  input { width: 100%; height: 52px; border-radius: 14px; border: 1px solid #33363e; background: #17181c; color: inherit;
          font: inherit; padding: 0 14px; user-select: text; -webkit-user-select: text; }
  .field { display: flex; gap: 8px; margin-bottom: 10px; }
  .field button { flex: 0 0 84px; height: 52px; font-size: 15px; }
  .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
  .apps button { height: 48px; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; }
  .power { background: #4a2125; }
  #status { min-height: 20px; font-size: 14px; color: #ff8787; margin: 8px 0; }
  #login { display: none; }
  #share { white-space: pre-wrap; word-break: break-all; font-size: 12px; opacity: .55; margin-top: 22px;
           user-select: text; -webkit-user-select: text; }
  #login p { opacity: .7; }
</style>
</head>
<body>
<main>
  <h1>Free My TV</h1>
  <div id="login">
    <p id="pinHint"></p>
    <div class="field"><input id="pin" inputmode="numeric" maxlength="6" autocomplete="off"><button id="pinGo">OK</button></div>
  </div>
  <div id="remote">
    <div class="row">
      <button class="power" data-key="223" id="sleepBtn"></button>
      <button data-key="164">🔇</button>
      <button data-key="25">🔉</button>
      <button data-key="24">🔊</button>
    </div>
    <div class="pad">
      <button data-key="4">↩</button><button data-key="19">▲</button><button data-key="3">⌂</button>
      <button data-key="21">◀</button><button class="ok" data-key="23" data-hold="1">OK</button><button data-key="22">▶</button>
      <button data-key="82">☰</button><button data-key="20">▼</button><button data-key="67">⌫</button>
    </div>
    <div class="row">
      <button data-key="89">⏪</button>
      <button data-key="85">⏯</button>
      <button data-key="90">⏩</button>
    </div>
    <div class="field"><input id="text" autocomplete="off"><button id="textGo"></button></div>
    <div class="field"><input id="url" inputmode="url" autocomplete="off" placeholder="https://"><button id="urlGo"></button></div>
    <div class="apps" id="apps"></div>
    <pre id="share"></pre>
  </div>
  <div id="status"></div>
</main>
<script>
  var ru = /^(ru|be|uk)/i.test(navigator.language || "");
  var T = ru ? {
    pin: "Введите PIN из «Настройки Home» → «Пульт с телефона» на телевизоре.",
    sleep: "Выкл.", send: "Ввести", open: "Открыть", text: "Текст в поле на ТВ",
    wrong: "Неверный PIN", locked: "Слишком много попыток, подождите 5 минут", offline: "Телевизор не отвечает",
    share: "Ссылка для ярлыка «Поделиться» (iPhone: Команды; Android: HTTP Shortcuts), ссылка в конце:"
  } : {
    pin: "Enter the PIN from Home Settings → Phone remote on the TV.",
    sleep: "Off", send: "Type", open: "Open", text: "Text for the TV's field",
    wrong: "Wrong PIN", locked: "Too many tries, wait 5 minutes", offline: "The TV doesn't answer",
    share: "For a Share shortcut (iPhone: Shortcuts; Android: HTTP Shortcuts), the link at the end:"
  };
  var $ = function (id) { return document.getElementById(id); };
  $("pinHint").textContent = T.pin;
  $("sleepBtn").textContent = "⏻ " + T.sleep;
  $("textGo").textContent = T.send;
  $("urlGo").textContent = T.open;
  $("text").placeholder = T.text;
  var pin = localStorage.getItem("fmtvPin") || "";

  function status(text) { $("status").textContent = text || ""; }

  function call(path, body, done) {
    var x = new XMLHttpRequest();
    x.open("POST", "/api/" + path);
    x.setRequestHeader("X-Pin", pin);
    x.timeout = 8000;
    x.onload = function () {
      if (x.status === 200) { status(""); if (done) done(JSON.parse(x.responseText)); }
      else if (x.status === 403) { status(T.wrong); showLogin(); }
      else if (x.status === 429) { status(T.locked); showLogin(); }
      else status("HTTP " + x.status);
    };
    x.onerror = x.ontimeout = function () { status(T.offline); };
    x.send(body == null ? "" : String(body));
  }

  function showLogin() { $("login").style.display = "block"; $("remote").style.display = "none"; }

  function hello() {
    call("hello", "", function (r) {
      localStorage.setItem("fmtvPin", pin);
      shareHint();
      $("login").style.display = "none";
      $("remote").style.display = "block";
      var box = $("apps");
      box.innerHTML = "";
      (r.apps || []).forEach(function (a) {
        var b = document.createElement("button");
        b.textContent = a.label;
        b.onclick = function () { call("open", a.pkg); };
        box.appendChild(b);
      });
    });
  }

  $("pinGo").onclick = function () { pin = $("pin").value.trim(); hello(); };
  $("pin").onkeydown = function (e) { if (e.key === "Enter") $("pinGo").onclick(); };

  Array.prototype.forEach.call(document.querySelectorAll("[data-key]"), function (b) {
    var timer = null, held = false;
    b.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      held = false;
      if (b.dataset.hold) timer = setTimeout(function () { held = true; call("long", b.dataset.key); }, 550);
      else call("key", b.dataset.key);
      if (navigator.vibrate) navigator.vibrate(10);
    });
    var up = function () {
      if (timer) { clearTimeout(timer); timer = null; if (!held) call("key", b.dataset.key); }
    };
    b.addEventListener("pointerup", up);
    b.addEventListener("pointercancel", function () { clearTimeout(timer); timer = null; });
    b.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  });

  $("textGo").onclick = function () {
    var v = $("text").value;
    if (v) call("text", v, function () { $("text").value = ""; });
  };
  $("urlGo").onclick = function () {
    var v = $("url").value.trim();
    if (v && !/https?:\/\//i.test(v)) v = "https://" + v;
    if (v) call("url", v, function () { $("url").value = ""; });
  };

  function shareHint() {
    $("share").textContent = T.share + "\n" + location.origin + "/share?pin=" + pin + "&u=";
  }

  if (pin) hello(); else showLogin();
</script>
</body>
</html>
